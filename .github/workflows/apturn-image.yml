---
# Obraz Postiz z brandingiem Apturn i polskim tłumaczeniem -> ghcr.io/madern/postiz-app
name: "Apturn image"

on:
  workflow_dispatch:
  push:
    branches:
      - apturn
      - apturn-rebrand

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        env:
          # Wersja upstream, na której stoi gałąź apturn; zmieniać przy rebase na nowy tag.
          UPSTREAM: v2.25.3
        run: |
          IMG=ghcr.io/madern/postiz-app
          SHORT=$(git rev-parse --short HEAD)
          # Tagi produkcyjne tylko z gałęzi apturn; inna gałąź dostaje tag ze swoją nazwą.
          if [ "${GITHUB_REF_NAME}" = "apturn" ]; then
            TAGS="-t ${IMG}:apturn-${UPSTREAM} -t ${IMG}:apturn-${SHORT} -t ${IMG}:apturn"
          else
            TAGS="-t ${IMG}:${GITHUB_REF_NAME}"
          fi
          docker buildx build --platform linux/amd64 \
            -f Dockerfile.dev \
            --build-arg NEXT_PUBLIC_VERSION=${UPSTREAM}-apturn \
            --build-arg SOURCE_REF=${GITHUB_REF_NAME} \n            --provenance=false --sbom=false \
            ${TAGS} --push .
